# Render Blueprint — one-click deploy for RecoveryAI.
# In the Render dashboard: New + -> Blueprint -> pick this repo. Render reads
# this file, builds the service, and asks you to paste GEMINI_API_KEY.
services:
  - type: web
    name: recoveryai
    runtime: python
    plan: free
    rootDir: model_routing
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you paste this in the dashboard; never committed
      - key: PYTHON_VERSION
        value: "3.12.6"
